name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            summary=$(grep -Ei '(^e: |error:|artifact:|licen[cs]e|unknown|not allowed|failed|what went wrong)' build.log \
              | tail -n 120 | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::$summary"
          fi
          exit "$build_status"
      - name: Check
        run: ./gradlew checkSortDependencies
      - name: Upload signed debug APK
        uses: actions/upload-artifact@v7
        with:
          name: lightning-browser-debug-${{ github.sha }}
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 14
